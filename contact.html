<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Philip Oladele | Start a Project</title>
  <link rel="icon" type="image/png" href="https://philipoladele.com/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=32" />
  <style>
    .page { padding-top:110px; padding-bottom:90px; }
    .page h2 { font-size:clamp(2.2rem,6vw,4.2rem); line-height:.95; max-width:14ch; }
    .split { display:grid; grid-template-columns:1.05fr .95fr; gap:42px; }
    .chat { background:rgba(12,10,8,.8); border:1px solid rgba(240,217,160,.16); border-radius:24px; padding:20px; min-height:460px; }
    .line { display:flex; gap:10px; align-items:flex-end; margin:14px 0; animation:pop .35s cubic-bezier(.22,1,.36,1); }
    .line.right { flex-direction:row-reverse; }
    @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
    .av { width:36px; height:36px; border-radius:50%; object-fit:cover; object-position:center 18%; flex:none; }
    .av.g { background:#2a241c; color:#f0d9a0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
    .bubble { max-width:78%; padding:12px 14px; border-radius:18px; line-height:1.45; }
    .guest { background:#1c1814; color:#f3ead8; border-bottom-left-radius:4px; }
    .host { background:#f0d9a0; color:#1a140c; border-bottom-right-radius:4px; }
    .who { font-size:11px; color:#b7aa94; margin:0 0 4px; }
    .who.r { text-align:right; }
    .typing { display:flex; gap:5px; padding:12px 16px; background:#1c1814; border-radius:18px; width:fit-content; }
    .typing i { width:7px; height:7px; border-radius:50%; background:#f0d9a0; display:block; animation:blink 1s infinite; }
    .typing i:nth-child(2){ animation-delay:.15s; }
    .typing i:nth-child(3){ animation-delay:.3s; }
    @keyframes blink { 0%,80%,100%{ opacity:.25; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-3px);} }
    .step { letter-spacing:.18em; text-transform:uppercase; color:#d4af6a; font-size:11px; margin:0 0 10px; }
    form label { display:block; margin:12px 0 6px; font-size:13px; color:#d4af6a; }
    form input, form textarea, form select { width:100%; background:#120f0c; border:1px solid rgba(240,217,160,.22); color:#f3ead8; padding:12px; border-radius:10px; }
    form textarea { min-height:110px; }
    .pill { display:inline-block; border-radius:999px; padding:12px 18px; font-weight:600; background:#f0d9a0; color:#1a140c; border:0; }
    @media(max-width:860px){ .split{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <header class="header" id="site-header">
    <nav class="nav wrap">
      <a class="logo" href="/">Philip Oladele</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a class="nav-link" href="/">Home</a></li>
        <li><a class="nav-link" href="about.html">About</a></li>
        <li><a class="nav-link" href="services.html">Services</a></li>
        <li><a class="nav-link" href="process.html">Process</a></li>
        <li><a class="nav-link" href="pricing.html">Pricing</a></li>
        <li><a class="nav-link" href="projects.html">Work</a></li>
        <li><a class="nav-link" href="reviews.html">Reviews</a></li>
        <li><a class="nav-link" href="faq.html">FAQ</a></li>
        <li><a class="nav-link nav-cta" href="contact.html">Begin</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </nav>
  </header>
  <main class="section page">
    <div class="wrap">
      <p class="kicker">Begin</p>
      <h2>Send a link. Start the work.</h2>
      <div class="split" style="margin-top:32px;">
        <div>
          <p class="step">The conversation</p>
          <div class="chat" id="chat"></div>
        </div>
        <div>
          <p class="step">Get started</p>
          <h2>Your brief.</h2>
          <form action="https://formsubmit.co/philipteam51@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New project enquiry from philipoladele.com" />
            <input type="hidden" name="_captcha" value="false" />
            <label>Name</label><input name="name" type="text" required />
            <label>Email</label><input name="email" type="email" required />
            <label>Service</label>
            <select name="service">
              <option>Social media management</option>
              <option>Book trailer $100</option>
              <option>Book campaign</option>
              <option>Website / UI UX</option>
              <option>Not sure yet</option>
            </select>
            <label>Project timeline</label>
            <select name="timeline" required>
              <option value="">Select a timeline</option>
              <option>As soon as possible</option>
              <option>Within 2 weeks</option>
              <option>30 days</option>
              <option>60 days</option>
              <option>Ongoing retainer</option>
            </select>
            <label>What should this work do</label>
            <textarea name="message" required></textarea>
            <p style="margin-top:18px;"><button class="pill" type="submit">Get started</button></p>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js?v=32"></script>
  <script>
    const chat = document.getElementById("chat");
    const msgs = [
      { side: "left", name: "Client", text: "Know anyone who can run social and a page for a launch?" },
      { side: "right", name: "Philip Oladele", text: "That is the studio. Social, UI/UX, trailers. Scorecard first. Then we pick the plan." },
      { side: "left", name: "Client", text: "How fast?" },
      { side: "right", name: "Philip Oladele", text: "Trailer in days. Sprint in two weeks. Site on a timeline you choose on the form." },
      { side: "left", name: "Client", text: "Send me the start link." },
      { side: "right", name: "Philip Oladele", text: "philipoladele.com/contact. Get started on the right." }
    ];
    function typing(side) {
      const wrap = document.createElement("div");
      wrap.className = "line" + (side === "right" ? " right" : "");
      wrap.id = "typing";
      wrap.innerHTML = side === "right"
        ? '<img class="av" src="philip-oladele.jpg" alt="" /><div class="typing"><i></i><i></i><i></i></div>'
        : '<div class="av g">CL</div><div class="typing"><i></i><i></i><i></i></div>';
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    function say(m) {
      const el = document.createElement("div");
      el.className = "line" + (m.side === "right" ? " right" : "");
      const av = m.side === "right"
        ? '<img class="av" src="philip-oladele.jpg" alt="Philip Oladele" />'
        : '<div class="av g">CL</div>';
      el.innerHTML = av + '<div><div class="who' + (m.side === "right" ? " r" : "") + '">' + m.name + '</div><div class="bubble ' + (m.side === "right" ? "host" : "guest") + '">' + m.text + "</div></div>";
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }
    async function play() {
      for (const m of msgs) {
        typing(m.side);
        await new Promise(r => setTimeout(r, m.side === "right" ? 1100 : 800));
        const t = document.getElementById("typing");
        if (t) t.remove();
        say(m);
        await new Promise(r => setTimeout(r, 500));
      }
    }
    play();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients 3D — paste this into philipoladele.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080c;
      --ink: #f4efe6;
      --muted: #9a937f;
      --gold: #d4b06a;
      --gold-2: #f0d59a;
      --line: rgba(244, 239, 230, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .clients-3d {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 7rem 1.25rem 8rem;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(212, 176, 106, 0.14), transparent 60%),
        radial-gradient(700px 500px at 110% 80%, rgba(90, 70, 180, 0.18), transparent 55%),
        #07080c;
    }
    .clients-3d::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(244,239,230,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244,239,230,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
      pointer-events: none;
    }
    .clients-3d .wrap {
      position: relative;
      max-width: 1180px;
      margin: 0 auto;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: 500;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }
    .clients-3d h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      font-weight: 400;
      line-height: 0.95;
      margin: 0.7rem 0 0.9rem;
      letter-spacing: -0.02em;
    }
    .clients-3d h2 em {
      font-style: italic;
      color: var(--gold-2);
    }
    .lede {
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      font-weight: 300;
    }

    .stage {
      perspective: 1400px;
      perspective-origin: 50% 45%;
      margin-top: 3.5rem;
      height: 420px;
      display: grid;
      place-items: center;
      touch-action: pan-y;
    }
    .ring {
      position: relative;
      width: 220px;
      height: 280px;
      transform-style: preserve-3d;
      animation: orbit 36s linear infinite;
    }
    .stage:hover .ring { animation-play-state: paused; }
    @keyframes orbit {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-360deg); }
    }

    .card {
      --i: 0;
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: rotateY(calc(var(--i) * 36deg)) translateZ(380px);
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      padding: 1.35rem 1.2rem 1.2rem;
      background:
        linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 40%, rgba(0,0,0,0.25)),
        #12141c;
      border: 1px solid var(--line);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.35s ease, box-shadow 0.35s ease, transform 0.35s ease;
    }
    .face::after {
      content: "";
      position: absolute;
      inset: auto -20% 18% -20%;
      height: 140px;
      background: radial-gradient(closest-side, rgba(212,176,106,0.22), transparent 70%);
      pointer-events: none;
    }
    .card:hover .face {
      border-color: rgba(212,176,106,0.55);
      box-shadow:
        0 24px 60px rgba(0,0,0,0.55),
        0 0 0 1px rgba(212,176,106,0.2),
        0 0 40px rgba(212,176,106,0.12);
      transform: translateZ(18px);
    }
    .mono {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }
    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin: 1.1rem 0 1rem;
      font-family: "Instrument Serif", serif;
      font-size: 1.35rem;
      color: #1a1408;
      background: linear-gradient(145deg, #f0d59a, #b8893a);
      box-shadow: 0 8px 20px rgba(212,176,106,0.28);
    }
    .name {
      font-family: "Instrument Serif", serif;
      font-size: 1.38rem;
      line-height: 1.15;
      margin-bottom: 0.35rem;
    }
    .role {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 300;
      line-height: 1.45;
      flex: 1;
    }
    .chip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .chip {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(212,176,106,0.35);
      color: var(--gold-2);
    }
    .go {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .floor {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: min(720px, 90%);
      height: 90px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 0%, rgba(212,176,106,0.18), transparent 70%);
      filter: blur(8px);
      pointer-events: none;
    }
    .hint {
      text-align: center;
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .grid .tile {
      border-radius: 18px;
      padding: 1.2rem;
      background: #12141c;
      border: 1px solid var(--line);
      min-height: 180px;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 820px) {
      .stage, .hint { display: none; }
      .grid { display: grid; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; }
      .stage, .hint { display: none; }
      .grid { display: grid; }
    }
  </style>
</head>
<body>
  <section class="clients-3d" aria-labelledby="clients-title">
    <div class="wrap">
      <p class="eyebrow">Roster</p>
      <h2 id="clients-title">People I have<br><em>worked with</em></h2>
      <p class="lede">Authors, operators and storytellers. Click a card to open the work.</p>

      <div class="stage" id="stage">
        <div class="ring" id="ring"></div>
        <div class="floor"></div>
      </div>
      <p class="hint">Hover to hold · drag to turn · click to open the case</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <script>
    const people = [
      { name: "Michael Vecchione", role: "Hard Guys Cry — campaign, trailer and social.", work: "Live campaign", initials: "MV", href: "case-hard-guys.html" },
      { name: "B.G. Howard",        role: "Fiction trailer cut for every platform.", work: "Trailer", initials: "BH", href: "projects.html" },
      { name: "Teresa Michael",     role: "Trailer updates on time, launch-ready cuts.", work: "Trailer", initials: "TM", href: "projects.html" },
      { name: "Benjamin Moe",       role: "Author social and launch architecture.", work: "Campaign", initials: "BM", href: "projects.html" },
      { name: "Jimmy Dennedy",      role: "Event publicity and story distribution.", work: "Publicity", initials: "JD", href: "projects.html" },
      { name: "Aryn Alyssabeth",    role: "Author brand and personal presence.", work: "Social", initials: "AA", href: "projects.html" },
      { name: "Meagan Poetschlag",  role: "Author engagement system.", work: "Social", initials: "MP", href: "projects.html" },
      { name: "R.L. Corbit",        role: "Author engagement and cadence.", work: "Social", initials: "RC", href: "projects.html" },
      { name: "Jessica King",       role: "Author engagement and presence.", work: "Social", initials: "JK", href: "projects.html" },
      { name: "Victoria Reiby",     role: "Author engagement and presence.", work: "Social", initials: "VR", href: "projects.html" }
    ];

    const ring = document.getElementById("ring");
    const grid = document.getElementById("grid");

    const inner = (p, i) => `
      <span class="mono">0${i + 1} / 10</span>
      <div class="avatar" aria-hidden="true">${p.initials}</div>
      <h3 class="name">${p.name}</h3>
      <p class="role">${p.role}</p>
      <div class="chip-row">
        <span class="chip">${p.work}</span>
        <span class="go">Open →</span>
      </div>`;

    people.forEach((p, i) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = p.href;
      a.style.setProperty("--i", i);
      a.setAttribute("aria-label", p.name + " — open work");
      a.innerHTML = `<div class="face">${inner(p, i)}</div>`;
      ring.appendChild(a);

      const t = document.createElement("a");
      t.className = "tile";
      t.href = p.href;
      t.innerHTML = inner(p, i);
      grid.appendChild(t);
    });

    const stage = document.getElementById("stage");
    let dragging = false, lastX = 0, extra = 0, moved = 0;

    stage.addEventListener("pointerdown", (e) => {
      dragging = true;
      moved = 0;
      lastX = e.clientX;
      ring.style.animation = "none";
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      extra += dx * 0.35;
      moved += Math.abs(dx);
      lastX = e.clientX;
      ring.style.transform = `rotateY(${extra}deg)`;
    });
    const stop = () => { dragging = false; };
    stage.addEventListener("pointerup", stop);
    stage.addEventListener("pointercancel", stop);

    ring.addEventListener("click", (e) => {
      if (moved > 8) e.preventDefault();
    });
  </script>
</body>
</html>
